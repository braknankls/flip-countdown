<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Countdown — Configurator</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bebas+Neue&family=Black+Ops+One&family=Bungee&family=Orbitron:wght@700&family=Oswald:wght@700&family=Rajdhani:wght@700&family=Russo+One&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #0d0d0d;
    --card-top:   #252525;
    --card-bot:   #181818;
    --digit:      #e8a020;
    --glow:       rgba(232,160,32,0.25);
    --sep:        #e8a020;
    --fold-line:  #0d0d0d;
    --clock-font: 'Bebas Neue', Impact, 'Arial Black', sans-serif;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    transition: background 0.35s;
  }

  /* ── Editable heading ── */
  .clock-message {
    color: #888;
    font-size: 11px;
    letter-spacing: 8px;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    margin-bottom: 36px;
    outline: none;
    border-bottom: 1px solid transparent;
    padding: 4px 10px;
    min-width: 100px;
    text-align: center;
    cursor: text;
    transition: border-color 0.2s, color 0.2s;
  }
  .clock-message:hover  { border-color: #2e2e2e; }
  .clock-message:focus  { border-color: #484848; color: #aaa; }
  .clock-message:empty::before {
    content: attr(data-placeholder);
    color: #2e2e2e;
    pointer-events: none;
  }

  /* ── Flip clock layout ── */
  .flip-clock {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .flip-unit { display: flex; flex-direction: column; align-items: center; }
  .flip-digits { display: flex; gap: 4px; }
  .unit-label {
    margin-top: 10px;
    color: #333;
    font-size: 9px;
    letter-spacing: 4px;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
  }

  /* ── Separators ── */
  .sep {
    font-size: 76px;
    color: var(--sep);
    line-height: 100px;
    padding: 0 2px;
    user-select: none;
    font-family: var(--clock-font);
    text-shadow: 0 0 18px var(--glow);
    transition: opacity 0.12s, color 0.35s, text-shadow 0.35s;
  }
  .sep.off { opacity: 0.12; }

  /* ── Flip card ── */
  .flip-card {
    position: relative;
    width: 72px;
    height: 100px;
    perspective: 280px;
    border-radius: 7px;
    box-shadow: 0 6px 16px rgba(0,0,0,.7), 0 2px 4px rgba(0,0,0,.9),
                inset 0 1px 0 rgba(255,255,255,.04);
  }
  .flip-card::after {
    content: '';
    position: absolute; left: 0; right: 0;
    top: calc(50% - 1px); height: 2px;
    background: var(--fold-line);
    z-index: 20; pointer-events: none;
    transition: background 0.35s;
  }
  .card-top, .card-bottom, .flip-top, .flip-bottom {
    position: absolute; left: 0; right: 0; overflow: hidden;
  }
  .card-top, .flip-top {
    top: 0; height: 50%; border-radius: 7px 7px 0 0;
    background: var(--card-top); transition: background 0.35s;
  }
  .card-bottom, .flip-bottom {
    bottom: 0; height: 50%; border-radius: 0 0 7px 7px;
    background: var(--card-bot); transition: background 0.35s;
  }
  .card-top::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,.03), rgba(0,0,0,.18));
    pointer-events: none;
  }
  .card-bottom::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.3), rgba(0,0,0,.05));
    pointer-events: none;
  }
  .card-top .digit, .card-bottom .digit,
  .flip-top .digit, .flip-bottom .digit {
    position: absolute; left: 0; right: 0;
    height: 200%;
    display: flex; justify-content: center; align-items: center;
    font-size: 86px;
    font-family: var(--clock-font);
    color: var(--digit);
    text-shadow: 0 0 20px var(--glow), 0 2px 0 rgba(0,0,0,.6);
    user-select: none;
    transition: color 0.35s, text-shadow 0.35s;
  }
  .card-top .digit, .flip-top .digit      { top: 0; }
  .card-bottom .digit, .flip-bottom .digit { bottom: 0; }
  .flip-top  { transform-origin: center bottom; transform: rotateX(0deg);  z-index: 10; }
  .flip-top::before {
    content: ''; position: absolute; inset: 0;
    background: transparent; transition: background .25s ease-in;
    pointer-events: none; z-index: 2; border-radius: 7px 7px 0 0;
  }
  .flipping .flip-top::before { background: rgba(0,0,0,.55); }
  .flip-bottom { transform-origin: center top; transform: rotateX(90deg); z-index: 10; }
  .flipping .flip-top    { animation: fold-away .25s ease-in  forwards; }
  .flipping .flip-bottom { animation: fold-in   .25s ease-out .25s forwards; }
  @keyframes fold-away { from{transform:rotateX(0)} to{transform:rotateX(-90deg)} }
  @keyframes fold-in   { from{transform:rotateX(90deg)} to{transform:rotateX(0)} }

  /* ── Expired notice ── */
  .expired-msg {
    margin-top: 28px;
    color: #8b3a00; font-size: 11px; letter-spacing: 6px;
    font-family: 'Courier New', monospace; text-transform: uppercase;
    opacity: 0; transition: opacity .8s; min-height: 1.2em;
  }
  .expired-msg.show { opacity: 1; }

  /* ── Settings panel ── */
  .settings {
    margin-top: 48px;
    width: 100%; max-width: 520px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .setting-row {
    display: grid; grid-template-columns: 76px 1fr;
    align-items: center; gap: 12px;
  }
  .setting-label {
    color: #363636; font-size: 9px; letter-spacing: 3px;
    font-family: 'Courier New', monospace; text-transform: uppercase;
    white-space: nowrap; text-align: right;
  }
  .settings select,
  .settings input[type="datetime-local"] {
    background: #111; border: 1px solid #222; color: #666;
    padding: 8px 10px; border-radius: 4px;
    font-family: 'Courier New', monospace; font-size: 12px;
    outline: none; color-scheme: dark; cursor: pointer; width: 100%;
    transition: border-color .2s;
  }
  .settings select:focus,
  .settings input:focus { border-color: var(--digit); color: #999; }
  .settings select option { background: #111; }
  .color-row { display: flex; gap: 20px; align-items: center; }
  .color-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .color-item span {
    color: #363636; font-size: 8px; letter-spacing: 2px;
    font-family: 'Courier New', monospace; text-transform: uppercase;
  }
  input[type="color"] {
    width: 38px; height: 28px;
    border: 1px solid #2a2a2a; border-radius: 4px;
    background: none; padding: 2px; cursor: pointer;
    outline: none; -webkit-appearance: none; appearance: none;
    transition: border-color .2s;
  }
  input[type="color"]:hover { border-color: #444; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
  .settings-divider { border: none; border-top: 1px solid #1a1a1a; margin: 4px 0; }

  /* ── Canvas embed section ── */
  .canvas-wrap {
    margin-top: 32px;
    width: 100%; max-width: 520px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .canvas-btn {
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #555;
    padding: 11px 28px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
    display: flex; align-items: center; gap: 8px;
    width: 100%; justify-content: center;
  }
  .canvas-btn svg { flex-shrink: 0; transition: stroke .2s; }
  .canvas-btn:hover {
    border-color: var(--digit);
    color: var(--digit);
    background: rgba(0,0,0,.2);
  }
  .canvas-btn:hover svg { stroke: var(--digit) !important; }
  .canvas-btn:active { transform: translateY(1px); }

  .url-preview {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #1e1e1e;
    border-radius: 4px;
    padding: 9px 12px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #3a3a3a;
    word-break: break-all;
    line-height: 1.5;
    cursor: text;
    user-select: all;
    display: none;
  }
  .url-preview.visible { display: block; border-color: #2a2a2a; color: #555; }

  .canvas-note {
    color: #2a2a2a; font-size: 9px; letter-spacing: 2px;
    font-family: 'Courier New', monospace; text-transform: uppercase;
    text-align: center; line-height: 1.8;
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: #101018; border: 1px solid var(--digit);
    color: var(--digit);
    padding: 10px 22px; border-radius: 4px;
    font-family: 'Courier New', monospace; font-size: 11px;
    letter-spacing: 3px; text-transform: uppercase;
    opacity: 0; transition: opacity .3s, transform .3s;
    pointer-events: none; z-index: 9999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="clock-message" id="clockMessage"
     contenteditable="true" spellcheck="false"
     data-placeholder="Click to add a message">Countdown</div>

<div class="flip-clock">
  <div class="flip-unit">
    <div class="flip-digits">
      <div class="flip-card" id="d0"></div>
      <div class="flip-card" id="d1"></div>
    </div>
    <div class="unit-label">Days</div>
  </div>
  <span class="sep" id="sep0">:</span>
  <div class="flip-unit">
    <div class="flip-digits">
      <div class="flip-card" id="h0"></div>
      <div class="flip-card" id="h1"></div>
    </div>
    <div class="unit-label">Hours</div>
  </div>
  <span class="sep" id="sep1">:</span>
  <div class="flip-unit">
    <div class="flip-digits">
      <div class="flip-card" id="m0"></div>
      <div class="flip-card" id="m1"></div>
    </div>
    <div class="unit-label">Minutes</div>
  </div>
  <span class="sep" id="sep2">:</span>
  <div class="flip-unit">
    <div class="flip-digits">
      <div class="flip-card" id="s0"></div>
      <div class="flip-card" id="s1"></div>
    </div>
    <div class="unit-label">Seconds</div>
  </div>
</div>

<div class="expired-msg" id="expiredMsg">— Time's Up —</div>

<div class="settings">
  <hr class="settings-divider">
  <div class="setting-row">
    <span class="setting-label">Font</span>
    <select id="fontSelect">
      <option value="0">Bebas Neue — Classic Display</option>
      <option value="1">Orbitron — Sci-Fi Digital</option>
      <option value="2">Oswald — Bold Condensed</option>
      <option value="3">Rajdhani — Geometric Sans</option>
      <option value="4">VT323 — Pixel Terminal</option>
      <option value="5">Share Tech Mono — Tech Mono</option>
      <option value="6">Black Ops One — Military</option>
      <option value="7">Audiowide — Futuristic</option>
      <option value="8">Russo One — Bold Clean</option>
      <option value="9">Bungee — Retro Display</option>
    </select>
  </div>
  <div class="setting-row">
    <span class="setting-label">Colors</span>
    <div class="color-row">
      <div class="color-item">
        <span>Background</span>
        <input type="color" id="colorBg"    value="#0d0d0d">
      </div>
      <div class="color-item">
        <span>Card</span>
        <input type="color" id="colorCard"  value="#222222">
      </div>
      <div class="color-item">
        <span>Digits</span>
        <input type="color" id="colorDigit" value="#e8a020">
      </div>
    </div>
  </div>
  <div class="setting-row">
    <span class="setting-label">Target</span>
    <input type="datetime-local" id="targetDT">
  </div>
</div>

<div class="canvas-wrap">
  <button class="canvas-btn" id="canvasBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2"/><polyline points="8 21 12 17 16 21"/>
    </svg>
    Copy Canvas Embed
  </button>
  <div class="url-preview" id="urlPreview"></div>
  <p class="canvas-note">
    Canvas: Edit Page &rarr; HTML Editor &lt;/&gt; &rarr; paste at top<br>
    Or give students the URL shown above directly
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var FONTS = [
    { css: "'Bebas Neue', Impact, sans-serif",        slug: 'Bebas+Neue' },
    { css: "'Orbitron', sans-serif",                  slug: 'Orbitron:wght@700' },
    { css: "'Oswald', Impact, sans-serif",            slug: 'Oswald:wght@700' },
    { css: "'Rajdhani', sans-serif",                  slug: 'Rajdhani:wght@700' },
    { css: "'VT323', monospace",                      slug: 'VT323' },
    { css: "'Share Tech Mono', monospace",            slug: 'Share+Tech+Mono' },
    { css: "'Black Ops One', Impact, sans-serif",     slug: 'Black+Ops+One' },
    { css: "'Audiowide', sans-serif",                 slug: 'Audiowide' },
    { css: "'Russo One', Impact, sans-serif",         slug: 'Russo+One' },
    { css: "'Bungee', Impact, sans-serif",            slug: 'Bungee' },
  ];

  var pad  = function(n){ n=Math.max(0,Math.floor(n)); return (n<10?'0':'')+n; };
  var z2   = function(n){ return String(n).padStart(2,'0'); };
  var root = document.documentElement;

  function hexToRgb(hex){ return [1,3,5].map(function(i){ return parseInt(hex.slice(i,i+2),16); }); }
  function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
  function shiftHex(hex,d){
    return '#'+hexToRgb(hex).map(function(c){ return clamp(c+d,0,255).toString(16).padStart(2,'0'); }).join('');
  }
  function hexAlpha(hex,a){ var c=hexToRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
  function toInputVal(d){
    return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())+'T'+z2(d.getHours())+':'+z2(d.getMinutes());
  }

  var target = new Date(Date.now() + 60 * 60 * 1000);

  var msgEl      = document.getElementById('clockMessage');
  var fontSel    = document.getElementById('fontSelect');
  var colorBg    = document.getElementById('colorBg');
  var colorCard  = document.getElementById('colorCard');
  var colorDigit = document.getElementById('colorDigit');
  var dtInput    = document.getElementById('targetDT');
  var expiredMsg = document.getElementById('expiredMsg');
  var canvasBtn  = document.getElementById('canvasBtn');
  var urlPreview = document.getElementById('urlPreview');
  var toastEl    = document.getElementById('toast');
  var seps       = ['sep0','sep1','sep2'].map(function(id){ return document.getElementById(id); });

  function applyColors() {
    var bg=colorBg.value, card=colorCard.value, digit=colorDigit.value;
    root.style.setProperty('--bg',        bg);
    root.style.setProperty('--fold-line', bg);
    root.style.setProperty('--card-top',  shiftHex(card, 14));
    root.style.setProperty('--card-bot',  shiftHex(card, -10));
    root.style.setProperty('--digit',     digit);
    root.style.setProperty('--sep',       digit);
    root.style.setProperty('--glow',      hexAlpha(digit, 0.28));
  }
  function applyFont(idx) {
    root.style.setProperty('--clock-font', FONTS[idx].css);
  }

  var STORE = 'flipClockV2';
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        msg: msgEl.textContent.trim(), font: parseInt(fontSel.value,10),
        bg: colorBg.value, card: colorCard.value, digit: colorDigit.value,
        tgt: target.toISOString(),
      }));
    } catch(e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (!s) return;
      if (s.msg)           msgEl.textContent = s.msg;
      if (s.font != null)  { fontSel.value = s.font; applyFont(s.font); }
      if (s.bg)            colorBg.value    = s.bg;
      if (s.card)          colorCard.value  = s.card;
      if (s.digit)         colorDigit.value = s.digit;
      if (s.bg||s.card||s.digit) applyColors();
      if (s.tgt)           { target = new Date(s.tgt); dtInput.value = toInputVal(target); }
    } catch(e) {}
  }

  function buildCard(el, d) {
    el.innerHTML =
      '<div class="card-top"><div class="digit">'    + d + '</div></div>' +
      '<div class="card-bottom"><div class="digit">' + d + '</div></div>' +
      '<div class="flip-top"><div class="digit">'    + d + '</div></div>' +
      '<div class="flip-bottom"><div class="digit">' + d + '</div></div>';
    el.dataset.v = d;
  }
  function setCard(el, next) {
    var prev = el.dataset.v;
    if (prev === next) return;
    el.dataset.v = next;
    var ctD=el.querySelector('.card-top .digit'), cbD=el.querySelector('.card-bottom .digit'),
        ftD=el.querySelector('.flip-top .digit'),  fbD=el.querySelector('.flip-bottom .digit');
    ftD.textContent=prev; fbD.textContent=next; ctD.textContent=next;
    el.classList.remove('flipping'); void el.offsetWidth; el.classList.add('flipping');
    setTimeout(function(){ cbD.textContent=next; ftD.textContent=next; el.classList.remove('flipping'); }, 560);
  }

  var cardIds=['d0','d1','h0','h1','m0','m1','s0','s1'], cards={};
  cardIds.forEach(function(id){ cards[id]=document.getElementById(id); buildCard(cards[id],'0'); });

  var sepOn = true;
  function tick() {
    var diff  = Math.max(0, Math.floor((target - Date.now()) / 1000));
    var days  = Math.min(Math.floor(diff / 86400), 99);
    var hours = Math.floor((diff % 86400) / 3600);
    var mins  = Math.floor((diff % 3600) / 60);
    var secs  = diff % 60;
    var ds=pad(days), hs=pad(hours), ms=pad(mins), ss=pad(secs);
    setCard(cards.d0,ds[0]); setCard(cards.d1,ds[1]);
    setCard(cards.h0,hs[0]); setCard(cards.h1,hs[1]);
    setCard(cards.m0,ms[0]); setCard(cards.m1,ms[1]);
    setCard(cards.s0,ss[0]); setCard(cards.s1,ss[1]);
    sepOn = !sepOn;
    seps.forEach(function(s){ s.className = (diff>0&&!sepOn)?'sep off':'sep'; });
    if (diff===0) expiredMsg.classList.add('show');
    else expiredMsg.classList.remove('show');
  }

  function buildClockUrl() {
    var msg   = msgEl.textContent.trim();
    var fIdx  = parseInt(fontSel.value, 10);
    var bg    = colorBg.value.slice(1);
    var card  = colorCard.value.slice(1);
    var digit = colorDigit.value.slice(1);
    var tgt   = target.toISOString();
    var dir   = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
    var params = new URLSearchParams({ msg:msg, target:tgt, bg:bg, card:card, digit:digit, font:fIdx });
    return dir + 'clock.html?' + params.toString();
  }

  function generateIframe() {
    return '<iframe src="' + buildClockUrl() + '" ' +
      'width="100%" height="260" frameborder="0" scrolling="no" ' +
      'style="border:none;display:block" title="Countdown Clock"></iframe>';
  }

  var toastTimer;
  function showToast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2800);
  }
  function copyText(text, label) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ showToast(label); }).catch(function(){ fallback(text,label); });
    } else { fallback(text,label); }
  }
  function fallback(text, label) {
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); showToast(label); }
    catch(e){ showToast('Select the URL above and press Ctrl+C'); }
    document.body.removeChild(ta);
  }

  canvasBtn.addEventListener('click', function () {
    copyText(generateIframe(), 'Canvas iframe copied!');
    urlPreview.textContent = buildClockUrl();
    urlPreview.classList.add('visible');
  });

  function hidePreview(){ urlPreview.classList.remove('visible'); }

  dtInput.value = toInputVal(target);
  dtInput.addEventListener('change', function(){ if(dtInput.value){ target=new Date(dtInput.value); save(); } expiredMsg.classList.remove('show'); hidePreview(); });
  fontSel.addEventListener('change', function(){ applyFont(parseInt(fontSel.value,10)); save(); hidePreview(); });
  [colorBg,colorCard,colorDigit].forEach(function(el){ el.addEventListener('input', function(){ applyColors(); save(); hidePreview(); }); });
  msgEl.addEventListener('input', function(){ save(); hidePreview(); });
  msgEl.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); msgEl.blur(); } });

  load();
  applyColors();
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
